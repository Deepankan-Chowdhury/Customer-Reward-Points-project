server:
 port: 8080

spring:
  application:
    name: rewardspoints
  datasource:
   url: jdbc:h2:mem:rewardpointsdb
   driver-class-name: org.h2.Driver
   username: deep
   password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.retailer.rewards: INFO
    org.springframework:web: INFO


